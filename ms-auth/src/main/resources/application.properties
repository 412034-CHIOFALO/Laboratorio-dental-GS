spring.application.name=ms-auth
server.port=8081
# Perfil activo. En produccion override con: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# --- Base de datos (H2 en desarrollo) ---------------------------------------
spring.datasource.url=jdbc:h2:mem:gs_auth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console - solo desarrollo, acceso RESTRINGIDO (ver SecurityConfig: /h2-console/**)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Eureka ------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Feign (llamada saliente a ms-finanzas al activar un empleado) -----------
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# --- Authorization Server ----------------------------------------------------
# Issuer URI expuesto en el discovery document (/.well-known/oauth-authorization-server)
spring.security.oauth2.authorizationserver.issuer=http://localhost:8081

# --- RSA Keystore para firma persistente de JWT ------------------------------
# El .p12 se genera UNA SOLA VEZ con keytool (ver /keys/README.md).
# La contrasena viene del env var GS_KEYSTORE_PASSWORD.
# PRODUCCION: usar un keystore diferente al de desarrollo.
gs.auth.keystore.path=${GS_KEYSTORE_PATH:classpath:keys/gs-auth.p12}
gs.auth.keystore.password=${GS_KEYSTORE_PASSWORD:gs_keystore_2025}
gs.auth.keystore.alias=gs-auth

# --- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# --- Logging ----------------------------------------------------------------
logging.level.com.gs=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
