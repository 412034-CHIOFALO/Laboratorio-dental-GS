# Perfil DEV - H2 en memoria, no requiere MySQL ni Docker
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Silenciar logs de Eureka (sigue habilitado para que el gateway nos rutee)
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
