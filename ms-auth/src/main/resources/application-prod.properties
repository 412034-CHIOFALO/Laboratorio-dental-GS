# ===========================================================================
#   ms-auth - perfil PROD (Docker)
#   Override del datasource (en dev usa H2 in-memory)
# ===========================================================================

# --- MySQL -----------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:gs_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - update conserva datos entre reinicios, show-sql off por performance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 console deshabilitada en produccion (en dev queda en /h2-console)
spring.h2.console.enabled=false

# --- Eureka (hostname interno del container) ------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=ms-auth
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Authorization Server --------------------------------------------------
# Issuer URI: cuando el frontend esta en otro origen, este URI debe ser el
# publico (no el interno del container). El login entra por /api/auth/login via
# gateway; el issuer puede quedar como el publico y los demas MS validan contra
# el JWK Set interno.
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:8081}

# --- Logging --------------------------------------------------------------
logging.level.com.gs=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
