# ===========================================================================
#   ms-catalogo - perfil PROD (Docker)
# ===========================================================================

# --- MySQL - hostname interno del container -------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:gs_catalogo}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 console off
spring.h2.console.enabled=false

# --- Eureka - hostname interno del container -------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=ms-catalogo
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- JWT validation contra ms-auth interno --------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://ms-auth:8081/oauth2/jwks}

# --- Multipart (fotos de catalogo) ----------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Logging
logging.level.com.gs=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
