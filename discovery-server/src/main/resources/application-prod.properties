# ===========================================================================
#   discovery-server - perfil PROD (Docker)
#   Activado via SPRING_PROFILES_ACTIVE=prod en docker-compose
# ===========================================================================

# El hostname dentro de la red de Docker coincide con el nombre del servicio
# en docker-compose (ej: "discovery-server"). Los demas MS apuntan aca.
eureka.instance.hostname=discovery-server

# Como es el propio servidor Eureka, NO se registra a si mismo
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Self-preservation desactivado en dev/prod sencillo para que los servicios
# caidos desaparezcan del registry en ~30s (mejor UX que esperar 90s)
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=15000

# Logging
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
