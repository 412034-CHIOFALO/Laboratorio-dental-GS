spring.application.name=ms-pedidos
server.port=8082
spring.profiles.active=dev

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gys_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Security — JWT Resource Server (valida contra ms-auth)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/oauth2/jwks}

# ─── Reglas de negocio ──────────────────────────────────────────
# Umbral en días hábiles a partir del cual un pedido se considera "atrasado".
# Configurable vía env var GS_DIAS_LIMITE_ATRASO (ej: para protesis = 8, brackets = 4).
gs.pedidos.dias-limite-atraso=${GS_DIAS_LIMITE_ATRASO:6}

# ─── Feign — timeouts cortos para no bloquear la transición de estado ──
# Si catalogo o stock están caídos, el pedido pasa a EN_PROCESO igual y queda
# logueado el warning. El admin puede ajustar stock manualmente después.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.gys=INFO
logging.level.org.springframework.web=WARN
