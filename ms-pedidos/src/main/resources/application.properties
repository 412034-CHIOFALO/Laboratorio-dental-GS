spring.application.name=ms-pedidos
server.port=8082
spring.profiles.active=dev

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gs_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Security - JWT Resource Server (valida contra ms-auth)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/oauth2/jwks}

# --- Bot de WhatsApp --------------------------------------------
gs.bot.uri=${BOT_URI:http://localhost:3001}
gs.bot.api-key=${BOT_API_KEY:}

# --- MinIO (almacenamiento de documentos adjuntos a pedidos) ----
gs.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
gs.minio.access-key=${MINIO_ROOT_USER:minioadmin}
gs.minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
gs.minio.bucket=${MINIO_BUCKET_DOCS:documentos-pedidos}
gs.minio.enabled=${MINIO_ENABLED:true}

# Tamano maximo de archivo subido (escaneos 3D STL/PLY pueden pesar bastante mas que unos MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# --- Reglas de negocio ------------------------------------------
# Umbral en dias habiles a partir del cual un pedido se considera "atrasado".
# Configurable via env var GS_DIAS_LIMITE_ATRASO (ej: para protesis = 8, brackets = 4).
gs.pedidos.dias-limite-atraso=${GS_DIAS_LIMITE_ATRASO:6}

# --- Feign + Resilience4j Circuit Breaker ----------------------------------
# Activa el circuit breaker en los clientes Feign.
# group.enabled=true -> un CB por servicio (ms-catalogo / ms-stock) en vez de
# uno por metodo, lo que simplifica la configuracion y el monitoreo.
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# -- Circuit Breaker ms-catalogo --------------------------------------------
# Se abre si el 50% de las ultimas 10 llamadas fallan.
# Permanece abierto 30s; en HALF-OPEN prueba con 3 llamadas.
resilience4j.circuitbreaker.instances.ms-catalogo.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-catalogo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-catalogo.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ms-catalogo.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ms-catalogo.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ms-catalogo.register-health-indicator=true

# Timeout por llamada a ms-catalogo (independiente del Feign read-timeout)
resilience4j.timelimiter.instances.ms-catalogo.timeout-duration=3s

# -- Circuit Breaker ms-stock -----------------------------------------------
resilience4j.circuitbreaker.instances.ms-stock.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-stock.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-stock.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ms-stock.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ms-stock.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ms-stock.register-health-indicator=true

resilience4j.timelimiter.instances.ms-stock.timeout-duration=3s

# Actuator - expone el estado de los circuit breakers en /actuator/health
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true

# Logging
logging.level.com.gs=INFO
logging.level.org.springframework.web=WARN
