name: CI

# Build + test de todos los microservicios y del frontend en cada push/PR
# a develop y main. (El deploy real — CD — se agrega cuando haya servidor/registry.)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # ── Microservicios (Java 17 + Maven) ───────────────────────────────────────
  backend:
    name: build & test · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - ms-auth
          - ms-catalogo
          - ms-pedidos
          - ms-finanzas
          - ms-stock
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests — no hay tests escritos; keystore y Eureka no disponibles en CI)
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean package -DskipTests

  # ── Frontend (Angular) ─────────────────────────────────────────────────────
  frontend:
    name: build · frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install & build
        working-directory: frontend-app
        # --legacy-peer-deps por el mismatch ngx-toastr 19 / Angular 20
        run: |
          npm ci --legacy-peer-deps
          npm run build

  # ── Bot (chequeo de sintaxis) ──────────────────────────────────────────────
  bot:
    name: syntax · bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        working-directory: gs-bot-whatsapp
        run: node --check index.js
