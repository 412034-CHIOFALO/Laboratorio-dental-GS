name: CI

# Build + test de todos los microservicios y del frontend en cada push/PR
# a develop y main. (El deploy real — CD — se agrega cuando haya servidor/registry.)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # ── Microservicios sin tests propios (solo build) ──────────────────────────
  build-only:
    name: build · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests — discovery/gateway no tienen tests propios)
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean package -DskipTests

  # ── MS con tests unitarios/slice (sin Testcontainers ni keystore) ──────────
  test-unit:
    name: test · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ms-catalogo
          - ms-stock
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (suite completa + JaCoCo)
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean test \
            -Deureka.client.enabled=false

  # ── ms-auth: tests sin el context-load (MsAuthApplicationTests necesita keystore) ──
  test-auth:
    name: test · ms-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (services + controllers + rate-limiter; excluye context-load)
        working-directory: ms-auth
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean test \
            -Dtest='!MsAuthApplicationTests' \
            -Deureka.client.enabled=false

  # ── ms-pedidos: unit tests + Testcontainers (MySQL) ───────────────────────
  test-pedidos:
    name: test · ms-pedidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (suite completa + Testcontainers IT + JaCoCo)
        working-directory: ms-pedidos
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean test \
            -Dspring.cloud.discovery.enabled=false \
            -Deureka.client.enabled=false

  # ── ms-finanzas: unit tests + Testcontainers (MySQL) ─────────────────────
  test-finanzas:
    name: test · ms-finanzas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (suite completa + Testcontainers IT + JaCoCo)
        working-directory: ms-finanzas
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean test \
            -Dspring.cloud.discovery.enabled=false \
            -Deureka.client.enabled=false

  # ── Frontend (Angular) ─────────────────────────────────────────────────────
  frontend:
    name: build · frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install & build
        working-directory: frontend-app
        # --legacy-peer-deps por el mismatch ngx-toastr 19 / Angular 20
        run: |
          npm ci --legacy-peer-deps
          npm run build

  # ── Bot (chequeo de sintaxis) ──────────────────────────────────────────────
  bot:
    name: syntax · bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        working-directory: gs-bot-whatsapp
        run: node --check index.js
