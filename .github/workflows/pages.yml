name: GitHub Pages (docs + demo)

# Publica en GitHub Pages, en un solo sitio:
#   /            -> demo del frontend (Angular, 100% mocks, sin backend real)
#   /docs/       -> JavaDoc de los 5 microservicios
#
# El repo es privado, pero el sitio publicado en Pages es público (GitHub lo
# permite: el codigo fuente sigue privado, solo se expone lo que este workflow
# arma en site/). Dispara al pushear a main o manualmente desde Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── JavaDoc de los 5 microservicios → site/docs/<ms> ──────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generar JavaDoc — ms-auth
        working-directory: ms-auth
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress javadoc:javadoc -DskipTests

      - name: Generar JavaDoc — ms-pedidos
        working-directory: ms-pedidos
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress javadoc:javadoc -DskipTests

      - name: Generar JavaDoc — ms-catalogo
        working-directory: ms-catalogo
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress javadoc:javadoc -DskipTests

      - name: Generar JavaDoc — ms-finanzas
        working-directory: ms-finanzas
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress javadoc:javadoc -DskipTests

      - name: Generar JavaDoc — ms-stock
        working-directory: ms-stock
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress javadoc:javadoc -DskipTests

      - name: Consolidar JavaDoc en site/docs/
        run: |
          mkdir -p site/docs
          for ms in ms-auth ms-pedidos ms-catalogo ms-finanzas ms-stock; do
            if [ -d "$ms/target/site/apidocs" ]; then
              cp -r "$ms/target/site/apidocs" "site/docs/$ms"
              echo "Copiado: $ms -> site/docs/$ms"
            else
              echo "ADVERTENCIA: $ms no genero apidocs"
            fi
          done

      - name: Crear indice de documentacion (site/docs/index.html)
        run: |
          cat > site/docs/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Documentación Técnica — Laboratorio G&S</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, sans-serif;
                background: #0f172a; color: #e2e8f0;
                margin: 0; min-height: 100vh;
                display: flex; flex-direction: column; align-items: center;
                padding: 3rem 1.5rem;
              }
              header { text-align: center; margin-bottom: 3rem; }
              header h1 { font-size: 2rem; font-weight: 800; color: #22c55e; margin: 0 0 .5rem; }
              header p  { color: #94a3b8; margin: 0; font-size: .95rem; }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 1.25rem; width: 100%; max-width: 900px;
              }
              .card {
                background: #1e293b; border: 1px solid #334155;
                border-radius: 12px; padding: 1.5rem;
                text-decoration: none; color: inherit;
                transition: border-color .2s, transform .15s;
              }
              .card:hover { border-color: #22c55e; transform: translateY(-2px); }
              .card-tag {
                font-size: .7rem; font-weight: 700; letter-spacing: 1px;
                color: #22c55e; text-transform: uppercase; margin-bottom: .5rem;
              }
              .card h2 { font-size: 1.1rem; margin: 0 0 .5rem; color: #f1f5f9; }
              .card p  { font-size: .82rem; color: #94a3b8; margin: 0; line-height: 1.5; }
              footer { margin-top: 4rem; color: #475569; font-size: .8rem; }
              footer a { color: #22c55e; }
            </style>
          </head>
          <body>
            <header>
              <h1>Laboratorio G&amp;S</h1>
              <p>Documentación técnica generada automáticamente desde el código fuente · TFI 2025</p>
            </header>
            <div class="grid">
              <a class="card" href="ms-auth/index.html">
                <div class="card-tag">Puerto 8081</div>
                <h2>ms-auth</h2>
                <p>Autenticación JWT RS256, registro y aprobación de usuarios, bitácora de auditoría inmutable.</p>
              </a>
              <a class="card" href="ms-pedidos/index.html">
                <div class="card-tag">Puerto 8082</div>
                <h2>ms-pedidos</h2>
                <p>Ciclo de vida de pedidos dentales: estados, fechas de entrega, documentos y escaneos MinIO.</p>
              </a>
              <a class="card" href="ms-catalogo/index.html">
                <div class="card-tag">Puerto 8083</div>
                <h2>ms-catalogo</h2>
                <p>Catálogo de tipos de trabajo con receta de materiales y precios de referencia.</p>
              </a>
              <a class="card" href="ms-finanzas/index.html">
                <div class="card-tag">Puerto 8085</div>
                <h2>ms-finanzas</h2>
                <p>Tres cajas, cuentas corrientes, sueldos en cascada, proveedores y bot de pagos.</p>
              </a>
              <a class="card" href="ms-stock/index.html">
                <div class="card-tag">Puerto 8086</div>
                <h2>ms-stock</h2>
                <p>Inventario de materiales dentales con descuento automático por receta del catálogo.</p>
              </a>
            </div>
            <footer>
              <a href="../">&larr; Volver a la demo del sistema</a>
              · Generado con Maven Javadoc Plugin
            </footer>
          </body>
          </html>
          HTML

      # ── Demo del frontend (Angular, 100% mocks) → site/ (raiz) ────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Build demo (mocks, sin backend)
        working-directory: frontend-app
        run: |
          npm ci --legacy-peer-deps
          npx ng build --configuration demo --base-href /${{ github.event.repository.name }}/

      - name: Copiar build al sitio + trick de rutas para SPA
        run: |
          cp -r frontend-app/dist/frontend-app/browser/. site/
          # GitHub Pages no soporta rewrites de servidor: cualquier ruta que no
          # sea un archivo real (ej. /dashboard/pedidos) devuelve 404. Copiamos
          # el index.html como 404.html para que Angular Router la resuelva
          # del lado del cliente una vez que el bundle ya cargo.
          cp site/index.html site/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Publicar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
