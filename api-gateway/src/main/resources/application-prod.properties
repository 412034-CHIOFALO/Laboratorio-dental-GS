# ===========================================================================
#   api-gateway - perfil PROD (Docker)
# ===========================================================================

# --- Eureka - hostname interno del container -------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=api-gateway
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- JWT validation contra ms-auth interno --------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://ms-auth:8081/oauth2/jwks}

# --- CORS ------------------------------------------------------------------
# En produccion el frontend (nginx) hace proxy interno: mismo origen, sin CORS.
# Si se accede al gateway directo desde el browser, el unico CORS lo aplica el
# SecurityConfig (bean corsConfigurationSource), con origenes via ALLOWED_ORIGINS.
# Los MS de atras tienen CORS deshabilitado (solo el gateway lo expone).

# --- Logging --------------------------------------------------------------
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cloud.gateway=INFO
