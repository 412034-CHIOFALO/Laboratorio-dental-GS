spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Rutas del Gateway
spring.cloud.gateway.mvc.routes[0].id=ms-auth
spring.cloud.gateway.mvc.routes[0].uri=lb://ms-auth
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/ms-auth/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[1].id=ms-catalogo
spring.cloud.gateway.mvc.routes[1].uri=lb://ms-catalogo
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/catalogo/**

spring.cloud.gateway.mvc.routes[2].id=ms-pedidos
spring.cloud.gateway.mvc.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.mvc.routes[3].id=ms-produccion
spring.cloud.gateway.mvc.routes[3].uri=lb://ms-produccion
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/produccion/**

spring.cloud.gateway.mvc.routes[4].id=ms-finanzas
spring.cloud.gateway.mvc.routes[4].uri=lb://ms-finanzas
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/finanzas/**

spring.cloud.gateway.mvc.routes[5].id=ms-stock
spring.cloud.gateway.mvc.routes[5].uri=lb://ms-stock
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/stock/**

# CORS global para Angular
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ─── JWT — Gateway valida el token antes de rutear ──────────────────────────
# El JWK Set se obtiene de ms-auth (lazy: se busca al primer request, no al arrancar)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/oauth2/jwks}

# Actuator del propio gateway
management.endpoints.web.exposure.include=health,info

# Silenciar logs innecesarios
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.level.org.springframework.security=WARN
