spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Rutas del Gateway
# ms-auth: el controller ya vive en /api/auth/** -> ruteamos directo, sin StripPrefix,
# para que sea uniforme con el resto (/api/catalogo, /api/pedidos, etc.).
spring.cloud.gateway.server.webmvc.routes[0].id=ms-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ms-auth
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-catalogo
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-catalogo
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/catalogo/**

spring.cloud.gateway.server.webmvc.routes[2].id=ms-pedidos
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/pedidos/**

# Odontologos viven dentro de ms-pedidos (mismo bounded context: clientes del lab)
spring.cloud.gateway.server.webmvc.routes[3].id=ms-pedidos-odontologos
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ms-pedidos
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/odontologos/**

spring.cloud.gateway.server.webmvc.routes[4].id=ms-finanzas
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ms-finanzas
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/finanzas/**

spring.cloud.gateway.server.webmvc.routes[5].id=ms-stock
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://ms-stock
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/stock/**

# Bot de WhatsApp - NO esta en Eureka (es Node), por eso URI directa configurable.
# En dev: localhost:3001. En Docker: http://gs-bot:3001 (via env BOT_URI).
spring.cloud.gateway.server.webmvc.routes[6].id=gs-bot
spring.cloud.gateway.server.webmvc.routes[6].uri=${BOT_URI:http://localhost:3001}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/bot/**

# CORS: se maneja en un unico lugar, el SecurityConfig del gateway (bean
# corsConfigurationSource, configurable via ALLOWED_ORIGINS). Los MS de atras
# tienen CORS deshabilitado porque nunca reciben trafico directo del browser.

# --- JWT - Gateway valida el token antes de rutear --------------------------
# El JWK Set se obtiene de ms-auth (lazy: se busca al primer request, no al arrancar)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/oauth2/jwks}

# Uploads de archivos (documentos adjuntos a pedidos pasan por el gateway)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Actuator del propio gateway
management.endpoints.web.exposure.include=health,info

# Silenciar logs innecesarios
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.level.org.springframework.security=WARN
