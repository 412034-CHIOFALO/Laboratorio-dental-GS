# Perfil DEV - usa H2 en memoria, no requiere MySQL

# Base de datos H2
spring.datasource.url=jdbc:h2:mem:gys_produccion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 Console - http://localhost:8084/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka deshabilitado en dev
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Feign deshabilitado - usamos datos propios (mock de pedidos)
spring.cloud.openfeign.enabled=false
