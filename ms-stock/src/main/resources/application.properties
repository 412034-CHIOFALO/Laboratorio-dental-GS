spring.application.name=ms-stock
server.port=8086
spring.profiles.active=dev

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gs_stock?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Security - JWT Resource Server (valida contra ms-auth)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/oauth2/jwks}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.gs=INFO
logging.level.org.springframework.web=WARN

# Bot WhatsApp - URL interna y API key para alertas de stock
# BOT_URI: mismo nombre de variable que usan gateway y ms-pedidos (consistencia).
gs.bot.url=${BOT_URI:http://localhost:3001}
gs.bot.api-key=${BOT_API_KEY:}
