# ===========================================================================
#   ms-stock - perfil PROD (Docker)
# ===========================================================================

# --- MySQL -----------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:gs_stock}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

# --- Eureka ----------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=ms-stock
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- JWT validation -------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://ms-auth:8081/oauth2/jwks}

# Logging
logging.level.com.gs=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
