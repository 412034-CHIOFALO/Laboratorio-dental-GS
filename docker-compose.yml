# ═══════════════════════════════════════════════════════════════════════════
#   ERP G&S — Stack completo (Producción)
#
#   Levanta: infra (MySQL, MinIO, Adminer) + ms-auth + 4 ms de negocio + discovery
#            + gateway + frontend (nginx) + bot de WhatsApp
#   Total: 12 containers + 1 red interna
#
#   Uso:
#     docker compose up -d            # primer arranque, compila todo
#     docker compose logs -f gateway  # tail logs de un servicio
#     docker compose down             # detener (mantiene volúmenes)
#     docker compose down -v          # detener + borrar BD y archivos
#
#   Acceso desde el host:
#     http://localhost          → Frontend (nginx)
#     http://localhost/adminer  → Adminer (UI web de MySQL; server=mysql, user/pass del .env)
#     http://localhost:8761     → Eureka dashboard
#     http://localhost:8080     → API Gateway (acceso directo, sin nginx)
#     http://localhost:9001     → MinIO console (user/pass = MINIO_ROOT_USER/PASSWORD del .env)
#
#   Orden de arranque automático vía depends_on con healthchecks:
#     mysql + minio  (infra)
#     ↓
#     discovery-server  (Eureka)
#     ↓
#     ms-auth  (Authorization Server)
#     ↓
#     ms-catalogo, ms-pedidos, ms-finanzas, ms-stock  (paralelo)
#     ↓
#     api-gateway
#     ↓
#     frontend (nginx)
# ═══════════════════════════════════════════════════════════════════════════

name: tfi

services:

  # ═════════════════════════ INFRAESTRUCTURA ═══════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: gs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-gs_root_2025}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [gs-net]

  minio:
    image: minio/minio
    container_name: gs-minio
    ports:
      # 9000 (API S3): solo loopback. Los MS lo consumen via red interna
      # 'minio:9000'; el browser nunca le pega directo (todo pasa por streaming
      # a traves del gateway).
      - "127.0.0.1:9000:9000"
      # 9001 (consola web): abierta para poder inspeccionar buckets/archivos
      # desde fuera del servidor. Protegida por MINIO_ROOT_USER/PASSWORD.
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [gs-net]

  # Adminer: UI web para MySQL, para inspeccionar tablas/filas sin instalar
  # un cliente de DB. Solo alcanzable a traves del nginx (ruta /adminer/,
  # ver frontend-app/nginx.conf), no expone un puerto propio al host.
  adminer:
    image: adminer:latest
    container_name: gs-adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    restart: unless-stopped
    networks: [gs-net]
    depends_on:
      mysql: { condition: service_healthy }

  # Backup diario (3 AM) de las 5 bases + archivos de MinIO a Google Drive.
  # Ver backup/README.md para la configuracion inicial de rclone (una vez).
  backup:
    build: ./backup
    container_name: gs-backup
    init: true   # crond como PID 1 sin esto tira "setpgid: Operation not permitted"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
      # Key interna para el botón "hacer backup ahora" — la valida el mini-server
      # de disparo; solo ms-auth la conoce (server-to-server, nunca el browser).
      BACKUP_TRIGGER_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
    volumes:
      - minio_data:/minio_data:ro
      # Directorio, no el archivo directo: rclone reescribe su config al
      # refrescar el token OAuth (rename atomico), y eso rompe con
      # "device or resource busy" si el archivo esta bind-mounteado solo.
      - ./backup/rclone-config:/root/.config/rclone
      - backup_tmp:/backups/tmp
    depends_on:
      mysql: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ DISCOVERY ════════════════════════════════════

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: gs-discovery
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ AUTH (primero después de discovery) ═══════════

  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: gs-auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gs_auth
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
      EUREKA_URI: http://discovery-server:8761/eureka/
      AUTH_ISSUER: http://localhost:8081
      GS_KEYSTORE_PASSWORD: ${GS_KEYSTORE_PASSWORD:-gs_keystore_2025}
      # Contraseñas iniciales de los usuarios que crea ms-auth en el primer arranque.
      GS_ADMIN_PASSWORD: ${GS_ADMIN_PASSWORD:-admin123}
      GS_TECNICO_PASSWORD: ${GS_TECNICO_PASSWORD:-tecnico123}
      # Pass del usuario de servicio 'bot-pedidos' (debe coincidir con la del bot).
      GS_BOT_PEDIDOS_PASSWORD: ${GS_BOT_PEDIDOS_PASSWORD:-cambiar-en-produccion}
      # Disparo del backup a demanda (botón de la UI): ms-auth llama al contenedor
      # de backup con esta key. Misma key interna que valida el mini-server de backup.
      BACKUP_URI: http://backup:3002
      GS_INTERNAL_API_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # Keystore RSA persistente: se genera una sola vez (primer arranque) y se
      # reusa en cada rebuild/restart. Sin esto, cada `docker compose up --build`
      # regeneraba la clave y invalidaba TODOS los JWT ya emitidos (deslogueaba
      # a todo el mundo en cada deploy).
      - ms_auth_keys:/app/keys
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ MICROSERVICIOS DE NEGOCIO ═════════════════════

  ms-catalogo:
    build:
      context: ./ms-catalogo
      dockerfile: Dockerfile
    container_name: gs-catalogo
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
      DB_HOST: mysql
      DB_NAME: gs_catalogo
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_JWK_URI: http://ms-auth:8081/oauth2/jwks
      # Auditoría centralizada: manda los eventos de catálogo a ms-auth.
      AUTH_URI: http://ms-auth:8081
      GS_INTERNAL_API_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      ms-auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    networks: [gs-net]

  ms-pedidos:
    build:
      context: ./ms-pedidos
      dockerfile: Dockerfile
    container_name: gs-pedidos
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
      DB_HOST: mysql
      DB_NAME: gs_pedidos
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_JWK_URI: http://ms-auth:8081/oauth2/jwks
      # Auditoría centralizada: manda los eventos de pedidos a ms-auth.
      AUTH_URI: http://ms-auth:8081
      GS_INTERNAL_API_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
      # MinIO para documentos y escaneos de pedidos (host interno; los archivos
      # se sirven en streaming a traves del propio backend, sin exponer MinIO)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_DOCS: documentos-pedidos
      MINIO_ENABLED: "true"
      # Bot de WhatsApp para notificaciones
      BOT_URI: http://gs-bot:3001
      BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      ms-auth: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    networks: [gs-net]

  ms-finanzas:
    build:
      context: ./ms-finanzas
      dockerfile: Dockerfile
    container_name: gs-finanzas
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
      DB_HOST: mysql
      DB_NAME: gs_finanzas
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_JWK_URI: http://ms-auth:8081/oauth2/jwks
      # Auditoría centralizada: manda los eventos financieros a ms-auth.
      AUTH_URI: http://ms-auth:8081
      GS_INTERNAL_API_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
      # API key del bot de WhatsApp (debe coincidir con la del bot)
      GS_BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}
      # MinIO para guardar comprobantes (host interno; los archivos se sirven
      # en streaming a traves del propio backend, sin exponer MinIO)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: comprobantes
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      ms-auth: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    networks: [gs-net]

  ms-stock:
    build:
      context: ./ms-stock
      dockerfile: Dockerfile
    container_name: gs-stock
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
      DB_HOST: mysql
      DB_NAME: gs_stock
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gs_root_2025}
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_JWK_URI: http://ms-auth:8081/oauth2/jwks
      # Auditoría centralizada: manda los eventos de stock a ms-auth.
      AUTH_URI: http://ms-auth:8081
      GS_INTERNAL_API_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
      # Bot de WhatsApp — para enviar alertas de stock bajo al admin
      BOT_URI: http://gs-bot:3001
      BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      ms-auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ API GATEWAY ═══════════════════════════════════

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: gs-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sin esto la JVM corre en UTC (default de la imagen) y LocalDateTime.now()
      # guarda 3 horas adelantadas: un pago de las 11:00 quedaba registrado 13:58.
      TZ: America/Argentina/Cordoba
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_JWK_URI: http://ms-auth:8081/oauth2/jwks
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:4200
      BOT_URI: http://gs-bot:3001          # ruta del gateway hacia el estado del bot
      GS_BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}   # para autenticar los POST que el gateway le reenvia al bot
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-server: { condition: service_healthy }
      ms-auth: { condition: service_healthy }
      ms-catalogo: { condition: service_healthy }
      ms-pedidos: { condition: service_healthy }
      ms-finanzas: { condition: service_healthy }
      ms-stock: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ FRONTEND (nginx) ══════════════════════════════

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: gs-frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ BOT DE WHATSAPP ═══════════════════════════════
  # Arranca con el stack. La sesión se persiste en el volumen wpp_auth, así que
  # solo escaneás el QR UNA vez (mostralo con: docker compose logs -f gs-bot).
  # Después se reconecta solo en cada reinicio/deploy.

  gs-bot:
    build:
      context: ./gs-bot-whatsapp
      dockerfile: Dockerfile
    container_name: gs-bot
    environment:
      TZ: America/Argentina/Cordoba
      BACKEND_URL: http://api-gateway:8080
      BACKEND_ENABLED: ${BOT_BACKEND_ENABLED:-true}
      BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}
      GRUPOS: ${BOT_GRUPOS:-Comprobantes Transferencias,Comprobantes Efectivo}
      GRUPOS_EFECTIVO: ${BOT_GRUPOS_EFECTIVO:-Comprobantes Efectivo}
      GRUPOS_JIDS: ${BOT_GRUPOS_JIDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    # Healthcheck de liveness del servidor HTTP del bot (no de la conexión a
    # WhatsApp). Usa node porque la imagen slim no trae wget/curl.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/bot/estado',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      api-gateway: { condition: service_healthy }
    volumes:
      - wpp_auth:/app/.wwebjs_auth          # sesión de WhatsApp (QR 1 sola vez)
    restart: unless-stopped
    networks: [gs-net]

  # ═════════════════════════ SCRAPER DE MAILS ═══════════════════════════════
  # Crea pedidos desde emails recibidos (IMAP + Gemini). Servicio separado del
  # bot de WhatsApp a propósito: un cuelgue de la conexión IMAP no debe poder
  # afectar la sesión de WhatsApp (mucho más lenta/frágil de recuperar). Si el
  # proceso se cuelga repetidamente, se reinicia solo (ver MAIL_MAX_FALLOS_CONSECUTIVOS
  # en mail-scraper.js) y Docker lo levanta de nuevo por `restart: unless-stopped`.
  gs-mail-scraper:
    build:
      context: ./gs-bot-whatsapp
      dockerfile: Dockerfile.mail-scraper
    container_name: gs-mail-scraper
    environment:
      TZ: America/Argentina/Cordoba
      BACKEND_URL: http://api-gateway:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.gmail.com}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_SECURE: ${MAIL_IMAP_SECURE:-true}
      MAIL_IMAP_USER: ${MAIL_IMAP_USER:-}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_POLL_INTERVAL: ${MAIL_POLL_INTERVAL:-120}
      MAIL_MAX_FALLOS_CONSECUTIVOS: ${MAIL_MAX_FALLOS_CONSECUTIVOS:-8}
      # Usuario de servicio para crear pedidos (la pass coincide con ms-auth).
      BOT_PEDIDOS_USER: ${BOT_PEDIDOS_USER:-bot-pedidos}
      BOT_PEDIDOS_PASSWORD: ${GS_BOT_PEDIDOS_PASSWORD:-cambiar-en-produccion}
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: unless-stopped
    networks: [gs-net]


# ═════════════════════════ NETWORK + VOLUMES ═════════════════════════════

networks:
  gs-net:
    driver: bridge
    name: gs-net

volumes:
  mysql_data:
    name: gs_mysql_data
  minio_data:
    name: gs_minio_data
  wpp_auth:
    name: gs_wpp_auth
  ms_auth_keys:
    name: gs_auth_keys
  backup_tmp:
    name: gs_backup_tmp
