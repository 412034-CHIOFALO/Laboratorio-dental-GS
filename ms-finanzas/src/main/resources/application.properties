spring.application.name=ms-finanzas
server.port=8085
spring.profiles.active=dev

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gs_finanzas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Feign - consulta pedidos y catalogo
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Security - JWT Resource Server (valida contra ms-auth)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://localhost:8081/oauth2/jwks}

# API key del bot de WhatsApp (header X-Bot-Api-Key). NO usa JWT (no expira).
# En produccion override con env var GS_BOT_API_KEY (una clave larga y secreta).
gs.bot.api-key=${GS_BOT_API_KEY:gs-bot-dev-key-cambiar-en-prod}

# --- MinIO (almacenamiento de comprobantes) ---------------------
# Los archivos se sirven en streaming a traves del propio backend (proxy),
# sin exponer MinIO directamente al navegador.
gs.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
gs.minio.access-key=${MINIO_ROOT_USER:minioadmin}
gs.minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
gs.minio.bucket=${MINIO_BUCKET:comprobantes}
# Si MinIO no esta disponible, el pago se registra igual (sin archivo).
gs.minio.enabled=${MINIO_ENABLED:true}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.gs=INFO
logging.level.org.springframework.web=WARN
