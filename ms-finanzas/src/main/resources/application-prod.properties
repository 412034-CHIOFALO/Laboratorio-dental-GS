# ===========================================================================
#   ms-finanzas - perfil PROD (Docker)
# ===========================================================================

# --- MySQL -----------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:gs_finanzas}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

# --- Eureka ----------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=ms-finanzas
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Feign timeouts -------------------------------------------------------
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# --- JWT validation -------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_URI:http://ms-auth:8081/oauth2/jwks}

# --- API key del bot de WhatsApp ------------------------------------------
gs.bot.api-key=${GS_BOT_API_KEY:gs-bot-dev-key-cambiar-en-prod}

# --- MinIO (comprobantes) --------------------------------------------------
# endpoint interno (container -> container), public-endpoint (browser -> MinIO).
gs.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
gs.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
gs.minio.access-key=${MINIO_ROOT_USER:minioadmin}
gs.minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
gs.minio.bucket=${MINIO_BUCKET:comprobantes}
gs.minio.enabled=${MINIO_ENABLED:true}

# Logging
logging.level.com.gs=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
