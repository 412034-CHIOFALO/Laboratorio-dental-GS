# ═══════════════════════════════════════════════════════════════════════════
#   nginx — sirve el SPA Angular y hace proxy al api-gateway interno
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen       80;
    server_name  localhost;

    # Tamaño máximo de body para uploads (fotos de catálogo, comprobantes,
    # escaneos 3D — los STL/PLY de alta resolución pueden pesar bastante más que 10MB)
    client_max_body_size 200M;

    # Compresión gzip para reducir el peso de los chunks de Angular
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # ─── SPA Angular ──────────────────────────────────────────────────────
    # Todos los archivos estáticos se sirven desde /usr/share/nginx/html.
    # try_files redirige cualquier ruta desconocida a index.html para que
    # el Router de Angular maneje la navegación client-side.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # No cachear el index.html para que los deploys se vean al instante
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Cache largo para assets con hash (Angular genera nombres con hash en prod)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Proxy a api-gateway: rutas /api/** ───────────────────────────────
    # El frontend hace fetch('/api/catalogo/...') y nginx lo reenvía al
    # api-gateway interno del container (hostname = nombre del servicio en
    # docker-compose). Sin CORS porque comparten origin desde el browser.
    # Incluye el flujo de auth: /api/auth/login, /api/auth/usuarios, etc.
    location /api/ {
        # Resolución DNS en runtime (DNS embebido de Docker) + variable en el
        # proxy_pass → nginx NO resuelve 'api-gateway' al arrancar, sino en cada
        # request. Así el frontend no crashea si el gateway todavía no levantó.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway_upstream api-gateway;
        proxy_pass         http://$gateway_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Generoso para subir/descargar archivos grandes (escaneos 3D STL/PLY)
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ─── Error pages ──────────────────────────────────────────────────────
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
